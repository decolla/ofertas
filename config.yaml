# Configuração do monitor de ofertas. Segredos ficam no .env, não aqui.

user_agent: "OfertasBot/0.1 (monitor pessoal de ofertas, uso nao comercial; respeita robots.txt)"
database: data/ofertas.db
lock_file: data/ofertas.lock
log_file: logs/ofertas.log

http:
  timeout_seconds: 20
  retries: 3              # tentativas extras em erro de rede/5xx
  backoff_base_seconds: 2 # espera 2, 4, 8...
  min_interval_per_host_seconds: 5
  # Tempo máximo por fonte numa execução: as páginas fixas vão primeiro e o
  # resto do rodízio fica para depois. Promobit levou 10-16 min de madrugada
  # em 2026-11-26 (timeouts + novas tentativas) e atrasou tudo.
  source_time_budget_seconds: 240

sources:
  # Agregadores de comunidade (todas as categorias): a maior fonte de ofertas.
  promobit:
    enabled: true
    urls:
      - https://www.promobit.com.br/promocoes/recentes/
      - https://www.promobit.com.br/
    # Páginas de categoria, de tag (/s/) e de loja em rodízio: 14 por execução,
    # cada uma lida a cada ~8 execuções (~2h40), para não martelar o site. A
    # paginação (?page=2) é ignorada pelo site: só estas páginas trazem mais.
    rotate_per_run: 14
