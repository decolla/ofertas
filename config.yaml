# Resumo diário no Telegram (enviadas, uso do Claude e o que quase passou).
digest:
  enabled: true
  hour: 21               # hora local; vai na 1ª execução depois dela
  near_miss_band: 20     # "quase passou" = nota entre min_score-20 e min_score
  max_items: 5

# Oferta enviada que a fonte passa a listar como encerrada: a mensagem é
# editada ("❌ Oferta encerrada"). Só olha envios destes últimos dias.
ended:
  window_days: 7

claude:
  enabled: true
  command: claude
  model: haiku
  batch_size: 20
  max_batches_per_run: 3   # backlog grande (1ª execução) é diluído em várias execuções
  timeout_seconds: 180
  daily_call_limit: 200   # Black Friday (antes 100/130); cada chamada avalia até 20 ofertas.
                          # O limite real é o de 5 h da assinatura: ao bater, pausa até a hora
                          # informada pelo CLI (sem gastar chamadas) e avisa uma vez.
  feedback_examples: 50    # últimos 👍/👎 do usuário enviados no prompt (0 desliga)
  # Durante a pausa pelo limite da assinatura, ofertas que passaram pelo NOSSO
  # histórico de preços (não só pelo preço "de") saem marcadas "sem avaliação".
  send_history_when_unavailable: true

health:
  alert_after_failures: 5  # falhas seguidas de uma fonte antes de avisar no Telegram
