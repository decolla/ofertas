[project]
name = "ofertas"
version = "0.1.0"
description = "Monitor de ofertas excepcionais de sites brasileiros com alerta no Telegram"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ofertas = "ofertas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ofertas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
